<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPoli — log in</title>
<link rel="stylesheet" href="/static/style.css">
<script>try{if(sessionStorage.getItem("sp_splash"))document.documentElement.classList.add("no-splash")}catch(e){}</script>
<link rel="stylesheet" href="/static/splash.css">
</head>
<body class="auth-body">
<div id="splash" aria-hidden="true"><div class="sp-bg"><i class="sp-blob sp-b1"></i><i class="sp-blob sp-b2"></i><i class="sp-blob sp-b3"></i><b class="sp-cross sp-c1">+</b><b class="sp-cross sp-c2">+</b><b class="sp-cross sp-c3">+</b><b class="sp-cross sp-c4">+</b><b class="sp-cross sp-c5">+</b></div><div class="sp-center"><div class="sp-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div><div class="sp-word">Smart<b>Poli</b></div><div class="sp-dots"><i></i><i></i><i></i></div></div></div>
<div class="auth-shell">
  <div class="auth-brand"><span class="brand-mark" aria-hidden="true"></span>SmartPoli</div>
  <p class="auth-tagline">Turn a confusing prescription into an understandable treatment journey.</p>

  <div class="card auth-card">
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab active" data-mode="login">Log in</button>
      <button type="button" class="auth-tab" data-mode="register">Create account</button>
    </div>

    <form id="authForm">
      <div id="registerFields" style="display:none;">
        <label for="name">Your name</label>
        <input type="text" id="name" autocomplete="name">

        <label for="role" style="margin-top:12px;">I am a</label>
        <select id="role">
          <option value="patient">Patient</option>
          <option value="caregiver">Caregiver</option>
          <option value="doctor">Doctor</option>
        </select>
      </div>

      <label for="email" style="margin-top:12px;">Email</label>
      <input type="email" id="email" autocomplete="email" required>

      <label for="password" style="margin-top:12px;">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <div id="passwordHint" class="auth-hint" style="display:none;">At least 8 characters.</div>

      <button type="submit" class="primary" id="submitBtn" style="margin-top:18px;width:100%;">Log in</button>
      <div id="authError" class="auth-error" role="alert"></div>
    </form>
  </div>

  <a class="auth-install" href="/install"><span aria-hidden="true">&#128241;</span> Install the SmartPoli app</a>

</div>

<script src="/static/auth.js"></script>
<script src="/static/login.js"></script>
<script src="/static/splash.js"></script>
<script src="/static/offline.js"></script>
</body>
</html>

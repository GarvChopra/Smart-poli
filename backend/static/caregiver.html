<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPoli — caregiver</title>
<link rel="stylesheet" href="/static/style.css">
<script>try{if(sessionStorage.getItem("sp_splash"))document.documentElement.classList.add("no-splash")}catch(e){}</script>
<link rel="stylesheet" href="/static/splash.css">
</head>
<body>
<div id="splash" aria-hidden="true"><div class="sp-bg"><i class="sp-blob sp-b1"></i><i class="sp-blob sp-b2"></i><i class="sp-blob sp-b3"></i><b class="sp-cross sp-c1">+</b><b class="sp-cross sp-c2">+</b><b class="sp-cross sp-c3">+</b><b class="sp-cross sp-c4">+</b><b class="sp-cross sp-c5">+</b></div><div class="sp-center"><div class="sp-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div><div class="sp-word">Smart<b>Poli</b></div><div class="sp-dots"><i></i><i></i><i></i></div></div></div>
<div id="app">

  <header class="topbar no-print">
    <div class="topbar-row">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false" aria-controls="navDrawer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>SmartPoli</div>
    </div>
  </header>

  <div class="nav-drawer-overlay no-print" id="navOverlay"></div>
  <div class="nav-drawer no-print" id="navDrawer" aria-label="Menu">
    <div class="nav-drawer-head">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>SmartPoli</div>
      <button class="ghost small" id="closeDrawerBtn" aria-label="Close menu">✕</button>
    </div>
    <div class="nav-drawer-body">
      <nav id="drawerNav" aria-label="Pages"></nav>
      <button class="ghost" id="a11yToggleBtn" title="Larger text and buttons" aria-pressed="false">Aa Larger text</button>
      <div class="session-chip" id="sessionChip"></div>
    </div>
  </div>

  <div class="body-row">
    <main class="content" id="page" style="max-width:900px;"></main>
  </div>
</div>

<script src="/static/auth.js"></script>
<script src="/static/icons.js"></script>
<script src="/static/feedback.js"></script>
<script src="/static/caregiver-pages.js"></script>
<script src="/static/caregiver.js"></script>
<script src="/static/splash.js"></script>
<script src="/static/offline.js"></script>
</body>
</html>

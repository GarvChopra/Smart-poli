<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPoli — Care connection</title>
<link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/doctor.css">
</head>
<body class="doctor-page"><div id="app">
  <header class="topbar no-print"><div class="topbar-row"><button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false" aria-controls="navDrawer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button><div class="brand"><span class="brand-mark"></span>SmartPoli</div></div></header>
  <div class="nav-drawer-overlay no-print" id="navOverlay"></div><nav class="pill-nav nav-drawer no-print" id="navDrawer" aria-label="Clinician workspace">
    <div class="nav-drawer-head"><div class="brand"><span class="brand-mark"></span>SmartPoli</div><button class="ghost small" id="closeDrawerBtn" aria-label="Close menu">✕</button></div>
    <button data-tab="patients" data-icon="users" class="active"><span class="nav-label">Connected patients</span></button>
    <button data-tab="overview" data-icon="clipboard"><span class="nav-label">Summary</span></button>
    <button data-tab="prescriptions" data-icon="fileText"><span class="nav-label">Prescriptions</span></button>
    <button data-tab="triage" data-icon="history"><span class="nav-label">Visits</span></button>
    <button data-tab="settings" data-icon="settings"><span class="nav-label">Settings</span></button>
  </nav>
  <div class="body-row"><main class="content">
    <section id="view-patients"><div class="doctor-welcome"><div><p class="eyebrow">CARE CONNECTION</p><h1>Your patients</h1><p>Patient records appear here after they connect with you.</p></div><button class="primary" id="linkPatientBtn">Connect patient</button></div>
      <input type="search" id="patientSearchInput" aria-label="Search connected patients" placeholder="Search connected patients" style="margin-bottom:12px">
      <div id="patientPicker" class="patient-picker-grid"></div>
      <div id="linkForm" class="card" style="display:none"><h3>Enter patient invite code</h3><p>Ask the patient to share their SmartPoli connection code.</p><div class="doctor-inline"><input id="linkCodeInput" placeholder="8-character code" maxlength="12"><button class="primary" id="redeemLinkBtn">Connect</button><button class="ghost" id="cancelLinkBtn">Cancel</button></div><div id="linkStatus" role="status"></div></div>
    </section>
    <div id="currentPatientBar" class="current-patient-bar" style="display:none"></div>
    <div id="recordTabs" class="doctor-record-tabs" role="tablist" aria-label="Patient record" style="display:none"><button data-record-tab="overview" class="active">Summary</button><button data-record-tab="prescriptions">Prescriptions</button><button data-record-tab="triage">Visits</button></div>
    <section id="view-overview" class="overview-grid" style="display:none"></section><section id="view-prescriptions" style="display:none"></section><section id="view-triage" style="display:none"></section>
    <section id="view-settings" style="display:none"><h1>Settings</h1><div class="card"><div class="session-chip" id="sessionChip"></div><button class="ghost" id="a11yToggleBtn">Aa Larger text</button></div></section>
  </main></div>
</div><script src="/static/auth.js"></script><script src="/static/icons.js"></script><script src="/static/day-timeline.js"></script><script src="/static/doctor.js"></script></body></html>

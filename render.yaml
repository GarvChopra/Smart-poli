services:
  - type: web
    name: smartpoli
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # Render's default runtime drifts to whatever Python is newest (was
      # 3.14 at one point) — too new for some dependencies' prebuilt wheels
      # (psycopg2-binary crashed on import: undefined symbol
      # _PyInterpreterState_Get). Pin to a version with mature wheel
      # support across the board instead of chasing one package at a time.
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SMARTPOLI_JWT_SECRET
        generateValue: true
      # sync:false, not a fixed value — this now points at a real Postgres
      # (Supabase) set manually in the dashboard. A fixed `value` here
      # would get silently overwritten back to sqlite on the next blueprint
      # sync.
      - key: SMARTPOLI_DATABASE_URL
        sync: false
      - key: SMARTPOLI_ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        value: "whatsapp:+14155238886"
      - key: SMARTPOLI_PUBLIC_BASE_URL
        sync: false
      - key: SMARTPOLI_SKIP_TWILIO_SIGNATURE
        value: "0"

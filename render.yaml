services:
  - type: web
    name: smartpoli
    # Docker instead of Render's native Python runtime: Tesseract OCR needs
    # the `tesseract-ocr` system binary, and native runtime can only `pip
    # install` — no way to install a non-Python package. See backend/Dockerfile.
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    rootDir: backend
    healthCheckPath: /
    envVars:
      # PYTHON_VERSION is a native-runtime setting — not read under Docker,
      # where backend/Dockerfile's FROM line pins the version instead.
      - key: SMARTPOLI_JWT_SECRET
        generateValue: true
      # sync:false, not a fixed value — this now points at a real Postgres
      # (Supabase) set manually in the dashboard. A fixed `value` here
      # would get silently overwritten back to sqlite on the next blueprint
      # sync.
      - key: SMARTPOLI_DATABASE_URL
        sync: false
      - key: SMARTPOLI_ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        value: "whatsapp:+14155238886"
      - key: SMARTPOLI_PUBLIC_BASE_URL
        sync: false
      - key: SMARTPOLI_SKIP_TWILIO_SIGNATURE
        value: "0"
